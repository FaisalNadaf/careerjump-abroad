<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>CareerJump | International Executive Education</title>
		<meta
			name="description"
			content="International Executive Education Programs for Working Professionals - CareerJump" />
		<meta
			name="keywords"
			content="international executive education, executive education for working professionals, global university credentials, executive programs India, university alumni status, AI for business leaders, generative AI executive program, data analytics executive program, leadership programme, CareerJump" />
		<meta
			name="robots"
			content="index, follow, max-image-preview:large" />
		<meta
			name="author"
			content="CareerJump" />
		<meta
			name="theme-color"
			content="#ffffff" />
		<meta
			name="format-detection"
			content="telephone=no" />
		<meta
			name="referrer"
			content="strict-origin-when-cross-origin" />

		<link
			rel="icon"
			href="/favicon.ico"
			sizes="any" />
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="/favicon-32x32.png" />
		<link
			rel="icon"
			type="image/png"
			sizes="16x16"
			href="/favicon-16x16.png" />
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="/apple-touch-icon.png" />
		<link
			rel="manifest"
			href="/site.webmanifest" />

		<!-- Open Graph -->
		<meta
			property="og:type"
			content="website" />
		<meta
			property="og:site_name"
			content="CareerJump" />
		<meta
			property="og:locale"
			content="en_IN" />
		<meta
			property="og:title"
			content="CareerJump | International Executive Education" />
		<meta
			property="og:description"
			content="International Executive Education Programs for Working Professionals - CareerJump" />
		<meta property="og:image" content="/og-image.jpg" />
		<meta
			property="og:image:type"
			content="image/jpeg" />
		<meta
			property="og:image:width"
			content="1200" />
		<meta
			property="og:image:height"
			content="630" />
		<meta
			property="og:image:alt"
			content="CareerJump: Earn a Global University Credential. Advance your career without leaving your job." />

		<!-- Twitter / X -->
		<meta
			name="twitter:card"
			content="summary_large_image" />
		<meta
			name="twitter:title"
			content="CareerJump | International Executive Education" />
		<meta
			name="twitter:description"
			content="International Executive Education Programs for Working Professionals - CareerJump" />
		<meta name="twitter:image" content="/og-image.jpg" />
		<meta
			name="twitter:image:alt"
			content="CareerJump: Earn a Global University Credential." />

		<!-- Fonts are self-hosted (src/styles/fonts.css); preload the two used above the fold -->
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			href="/fonts/newsreader-normal-latin.woff2"
			crossorigin />
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			href="/fonts/hanken-grotesk-normal-latin.woff2"
			crossorigin />

		<!-- Hero poster (LCP): media queries mirror the <picture> sources in Hero.tsx -->
		<link
			rel="preload"
			as="image"
			href="/media/hero/hero-poster-mobile.webp"
			type="image/webp"
			media="(max-width: 767px) and (orientation: portrait)"
			fetchpriority="high" />
		<link
			rel="preload"
			as="image"
			href="/media/hero/hero-poster.webp"
			type="image/webp"
			media="(min-width: 768px), (orientation: landscape)"
			fetchpriority="high" />

		<!-- Boot loader styles (self-contained; see src/styles/loader.css) -->
		<link
			rel="stylesheet"
			href="/src/styles/loader.css" />

		<script>
			(function (root) {
				root.classList.add("js", "is-loading");
				// Safety net: never keep the page locked if the app fails to boot.
				setTimeout(function () {
					root.classList.remove("is-loading");
				}, 6000);
			})(document.documentElement);
		</script>
	</head>
	<body>
		<!-- Boot loader: decorative, lifted by src/lib/loader.ts -->
		<div
			class="loader"
			id="loader"
			aria-hidden="true">
			<div class="loader__stage">
				<div class="loader__brand">
					<svg
						class="loader__trail"
						viewBox="0 0 220 115"
						preserveAspectRatio="none"
						focusable="false">
						<defs>
							<mask
								id="loader-trail-mask"
								maskUnits="userSpaceOnUse"
								x="-20"
								y="-60"
								width="260"
								height="200">
								<path
									class="loader__trail-reveal"
									d="M0 115 Q110 -38 220 115"
									pathLength="1" />
							</mask>
						</defs>
						<path
							class="loader__trail-dots"
							d="M0 115 Q110 -38 220 115"
							mask="url(#loader-trail-mask)" />
					</svg>
					<span class="loader__mark">
						<img
							src="/brand/careerjump-mark.webp"
							width="192"
							height="192"
							alt="" />
					</span>
					<span class="loader__word">
						<img
							src="/brand/careerjump-wordmark-white.webp"
							width="432"
							height="78"
							alt="" />
					</span>
				</div>
				<p class="loader__tag">
					<span>International</span>
					<span>Executive</span>
					<span>Education</span>
				</p>
			</div>
		</div>
		<noscript>
			<header class="noscript-message">
				<h1>Earn a Global University Credential.</h1>
				<p>
					Advance Your Career Without Leaving Your Job. International Executive
					Education from Global Universities.
				</p>
				<p>Please enable JavaScript to join the CareerJump Founding Waitlist.</p>
			</header>
		</noscript>
		<div id="root"></div>
		<script
			type="module"
			src="/src/main.tsx"></script>
	</body>
</html>
